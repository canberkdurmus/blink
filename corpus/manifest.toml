# Blink test corpus (SPEC §11.3).
#
# Files are fetched by `cargo xtask corpus fetch` into the git-ignored `corpus/cache/`.
# Every entry records its license; only redistributable files (prefer CC0) are allowed.
# Expected values are frozen: changing them requires a `golden-update:` commit trailer.
#
#
# Bootstrap (2026-11-17): exif.* from `exiftool -j -n` 13.25 (EXIF tags only: LensModel 0xA434,
# no makernote/composite values; absent tags are omitted). preview_w/h = largest embedded image
# (exiftool -b extraction; Leica M8 = uncompressed 320x240 IFD0 image). sensor_w/h = rawler 0.8.0
# recommended crop (= ExifImageWidth/RawImageCroppedSize); Nikon Z6_3 (HE, rawler can't decode):
# raw IFD size. badge per SPEC §3 (LOW-RES when preview long edge < 50% of sensor long edge).
# See docs/adr/0006-corpus.md.

