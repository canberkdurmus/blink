[package]
name = "blink-runtime"
description = "Blink effect executor, caches, file system access"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
blink-core.workspace = true
directories = "=6.0.0"
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
notify = { version = "=9.0.0", default-features = false, features = ["macos_fsevent"] }
blink-decode = { path = "../blink-decode" }
blink-xmp = { path = "../blink-xmp" }
trash = "=5.4.0"

[dev-dependencies]
blink-testkit = { path = "../blink-testkit" }
proptest = "1"
