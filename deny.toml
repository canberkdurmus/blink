# cargo-deny configuration (SPEC §8.4 dependency policy). Run weekly and on demand:
#   cargo deny check

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
# Transitive unmaintained crates (e.g. zbus via AccessKit) are tracked, not fatal.
unmaintained = "workspace"

[licenses]
version = 2
confidence-threshold = 0.9
# Licenses compatible with distributing Blink under MPL-2.0.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "0BSD",
  "ISC",
  "Zlib",
  "BSL-1.0",
  "Unicode-3.0",
  "Unlicense",
  "CC0-1.0",
  "MPL-2.0",
  "LGPL-2.1",
  "LGPL-2.1-or-later",
  # jpeg-encoder (dev-only fixtures in blink-testkit; never shipped)
  "IJG",
  # egui's bundled default fonts
  "OFL-1.1",
  "Ubuntu-font-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
